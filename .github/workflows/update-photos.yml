name: Update photo manifest

on:
  push:
    branches: [main]
    paths:
      - '**/*.jpg'
      - '**/*.jpeg'
      - '**/*.png'
      - '**/*.webp'
      - '**/*.gif'
      - '.github/workflows/update-photos.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate photos.json
        shell: python
        run: |
          import json
          from pathlib import Path

          extensions = {".jpg", ".jpeg", ".png", ".webp", ".gif"}
          excluded = {".git", ".github"}

          photos = []
          for path in Path(".").rglob("*"):
              if not path.is_file():
                  continue
              if any(part in excluded for part in path.parts):
                  continue
              if path.suffix.lower() in extensions:
                  photos.append(path.as_posix())

          photos.sort(key=str.casefold)

          with open("photos.json", "w", encoding="utf-8") as f:
              json.dump(
                  {"generated": "auto", "photos": photos},
                  f,
                  ensure_ascii=False,
                  indent=2
              )
              f.write("\n")

      - name: Commit manifest if changed
        run: |
          if git diff --quiet -- photos.json; then
            echo "photos.json is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add photos.json
          git commit -m "Update photo manifest"
          git push
